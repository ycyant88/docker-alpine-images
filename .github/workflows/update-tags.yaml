---
name: Update Alpine tags

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
	contents: write

jobs:
  update-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: |
          chmod +x ./src/setup.sh
          chmod +x ./src/update.sh
          ./src/setup.sh
          ./src/update.sh alpine

      - name: Commit updated tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/alpine/.alpine-version src/alpine/.alpine-versions
          git diff --cached --quiet || git commit -m "Update Alpine tags"
          git push
